<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demostración Media Queries</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            font-size: 18px;
            color: blue;
        }

        
        #resumen {
            display: none;
            padding: 15px;
            background-color: #ffe6e6;
            border: 1px solid #ffb3b3;
            margin-top: 15px;
            border-radius: 5px;
        }

       
        @media (min-width: 600px) {
            #resumen {
                display: block;
            }

            body {
                font-size: 16px;
                color: red;
            }
        }

        
        @media (min-width: 900px) {
            body {
                font-size: 14px;
                color: black;
            }

            #resumen {
                background-color: #e6ffe6;
                border-color: #b3ffb3;
            }
        }
    </style>
</head>
<body>

    <h1>Uso de Media Queries</h1>
    <p>Redimensiona la ventana del navegador para observar cómo cambian la visibilidad, el tamaño de letra y el color del texto según el ancho de pantalla.</p>

    <div id="resumen">
        <h2>Sección Resumen</h2>
        <p>Este bloque solo es visible cuando la pantalla tiene un ancho superior a 600px.</p>
    </div>

</body>
</html>
