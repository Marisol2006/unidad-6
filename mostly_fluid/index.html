<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escuela Virtual - Patrón Mostly Fluid</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 10px;
            background-color: #f4f4f9;
        }

        .container {
            width: 100%;
            display: flex;
            flex-wrap: wrap;
        }

      
        .c1, .c2, .c3, .c4, .c5 {
            padding: 20px;
            color: white;
            font-weight: bold;
            text-align: center;
            border: 2px solid #ffffff;
            border-radius: 6px;
        }

        .c1 { background-color: #e63946; }
        .c2 { background-color: #f1faee; color: #333; }
        .c3 { background-color: #a8dadc; color: #333; }
        .c4 { background-color: #457b9d; }
        .c5 { background-color: #1d3557; }

     
        .c1, .c2, .c3, .c4, .c5 {
            width: 100%;
        }

        
        @media (min-width: 600px) {
            .c2, .c3, .c4, .c5 {
                width: 50%;
            }
        }
 
        @media (min-width: 800px) {
            .c1 {
                width: 100%;
            }

            .c2 {
                width: 100%;
            }

            .c3, .c4, .c5 {
                width: 33.33%;
            }

            .container {
                width: 800px;
                margin-left: auto;
                margin-right: auto;
            }
        }
    </style>
</head>
<body>

    <h1 style="text-align: center;">Escuela Virtual Infantil</h1>

    <div class="container">
        <div class="c1">Caja 1 - Encabezado / Banner</div>
        <div class="c2">Caja 2 - Contenido Principal</div>
        <div class="c3">Caja 3 - Curso A</div>
        <div class="c4">Caja 4 - Curso B</div>
        <div class="c5">Caja 5 - Curso C</div>
    </div>

</body>
</html>
