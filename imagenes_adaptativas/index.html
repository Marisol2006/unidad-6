<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imágenes Adaptativas</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f0f0f0;
        }

        article {
            background-color: #ffffff;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        img {
            height: auto;
            display: block;
            border-radius: 4px;
        }

      
        .adaptativa-porcentaje-1 {
            width: 70%;
        }

      
        .adaptativa-porcentaje-2 {
            width: 50%;
        }

      
        .adaptativa-porcentaje-3 {
            width: 20%;
        }
    </style>
</head>
<body>

    <h1>Artículos con Imágenes Responsivas</h1>

    <!-- Artículo 1: Instrucción 1 -->
    <article>
        <h2>Primer Artículo (70% Ancho)</h2>
        <p>Esta imagen ocupa el 70% del ancho de su contenedor.</p>
        <img src="https://picsum.photos/800/400?random=1" alt="Artículo 1" class="adaptativa-porcentaje-1">
    </article>

    <!-- Artículo 2: Instrucción 3 -->
    <article>
        <h2>Segundo Artículo (50% Ancho)</h2>
        <p>Esta imagen ocupa el 50% del ancho de su contenedor.</p>
        <img src="https://picsum.photos/800/400?random=2" alt="Artículo 2" class="adaptativa-porcentaje-2">
    </article>

    <!-- Artículo 3: Instrucción 5 -->
    <article>
        <h2>Tercer Artículo (20% Ancho)</h2>
        <p>Esta imagen ocupa el 20% del ancho de su contenedor.</p>
        <img src="https://picsum.photos/800/400?random=3" alt="Artículo 3" class="adaptativa-porcentaje-3">
    </article>

</body>
</html>
